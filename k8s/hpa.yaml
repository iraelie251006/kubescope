apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kubescope-backend
  namespace: kubescope
  labels:
    app.kubernetes.io/name: kubescope-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kubescope-backend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
