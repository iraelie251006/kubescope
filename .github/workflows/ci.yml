name: Observability Service Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/kubescope

jobs:
  test:
    name: job for running tests
    runs-on: ubuntu-latest

    steps:
      - name: checkout java code
        uses: actions/checkout@v4

      - name: setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        env:
          ACCESS_EXPIRATION_MS: 900000
          REFRESH_EXPIRATION_MS: 604800000
        run: ./mvnw test -q

      - name: upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  build:
    needs: test
    runs-on: ubuntu-latest
    name: Build docker artifact

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      tag: ${{ steps.set-tag.outputs.tag }} # To use later on upcoming jobs

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: setup docker buildx
        uses: docker/setup-buildx-action@v3

      - name: compute image tag
        id: set-tag
        run: |
          SHA_TAG=${{ env.DOCKER_IMAGE }}:sha-${{ github.sha }}
          echo "tag=$SHA_TAG" >> "$GITHUB_OUTPUT"
          echo "SHA_TAG=$SHA_TAG" >> "$GITHUB_ENV"

      - name: push to docker hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.SHA_TAG }}
            ${{ env.DOCKER_IMAGE }}:latest
