spring:
  application:
    name: kubescope-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kubescope}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}

  security:
    jwt:
      secret: ${JWT_SECRET:ZGV2LXNlY3JldC1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi1kby1ub3QtdXNl}
      expiration-ms: ${ACCESS_EXPIRATION_MS:900000}
      refresh-expiration-ms: ${REFRESH_EXPIRATION_MS:604800000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # SMTP is best-effort (alerts only); a missing/unreachable relay must not
    # drag the aggregate /actuator/health to DOWN. Readiness/liveness are unaffected.
    mail:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}

kubescope:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  kubernetes:
    kubeconfig-path: ${KUBECONFIG_PATH:}
    in-cluster: ${IN_CLUSTER:false}
  collector:
    enabled: ${COLLECTOR_ENABLED:true}
    interval-seconds: ${METRICS_COLLECTION_INTERVAL_SECONDS:60}
  pricing:
    aws-api-enabled: ${AWS_PRICING_API_ENABLED:false}
    aws-region: ${AWS_REGION:us-east-1}
    default-region: ${AWS_REGION:us-east-1}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  alerts:
    enabled: ${ALERTS_ENABLED:true}
    evaluation-interval-seconds: ${ALERT_EVALUATION_INTERVAL_SECONDS:300}
    cooldown-minutes: ${ALERT_COOLDOWN_MINUTES:60}
    from-email: ${ALERT_FROM_EMAIL:alerts@kubescope.io}
